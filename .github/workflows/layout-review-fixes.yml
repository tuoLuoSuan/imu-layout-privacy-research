name: RoomTrace reproduction checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  roomtrace:
    runs-on: ubuntu-latest
    env:
      ATEN_CPU_CAPABILITY: avx2
      ONEDNN_MAX_CPU_ISA: AVX2
      MKL_CBWR: AVX2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: >-
          python -m unittest
          analysis.layout.tests.test_spatial088
          analysis.layout.tests.test_analytic077
          analysis.layout.tests.test_recovery076
          analysis.layout.tests.test_recovery077
          analysis.layout.tests.test_recovery078
          analysis.layout.tests.test_recovery081_runtime
          analysis.layout.tests.test_refine081_training
          analysis.layout.tests.test_eval081_pairing -v
      - run: python -m roomtrace download
      - run: python -m roomtrace summarize --out output/ci-confirmation.json
      - run: python tools/diagnose_roomtrace_platform.py
      - run: python -m roomtrace verify --threads 2 --out output/ci-inference.json
