name: Layout review regressions
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  layout-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy matplotlib joblib scikit-learn
      - run: python -m unittest discover -s analysis/layout/tests -v
