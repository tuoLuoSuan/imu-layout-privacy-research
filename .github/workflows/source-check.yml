name: Source admission checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/repository_guard.py --revision HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test showcase/tests/*.test.mjs
      - run: python -m unittest discover -s collection/phone-imu-recorder/tools -p 'test_*.py' -v

      - run: python -m unittest discover -s environment/lidar/tests -v
