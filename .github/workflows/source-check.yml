name: Source admission checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  joint-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install numpy
      - run: node --test collection/imu-capture-suite/tests/*.test.cjs
      - run: node --test collection/imu-capture-suite/maintenance/daily-0.2.23/tests/*.test.cjs
      - run: node --test collection/imu-capture-suite/maintenance/daily-0.2.19/tests/*.test.cjs
      - run: python -m unittest discover -s collection/imu-capture-suite/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s analysis/phone_pdr/tests -v
      - run: python -m unittest discover -s analysis/phone_ronin/tests -v
      - run: python -m unittest discover -s analysis/joint_privacy/tests -v
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo +stable test --locked --manifest-path collection/imu-capture-suite/plugin/Cargo.toml
      - run: cargo +stable test --locked --manifest-path collection/imu-capture-suite/maintenance/bridge-0.2.5/Cargo.toml
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/repository_guard.py --revision HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test showcase/tests/*.test.mjs
      - run: node --test collection/watch-s5-probe/tests/*.test.cjs
      - run: python -m unittest discover -s collection/watch-s5-probe/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s collection/phone-imu-recorder/tools -p 'test_*.py' -v

      - run: python -m unittest discover -s environment/lidar/tests -v

  receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup default stable
      - run: rustup target add wasm32-wasip2
      - run: cargo fetch --locked --manifest-path collection/astrobox-imu-receiver/Cargo.toml
      - run: python collection/astrobox-imu-receiver/tools/build_local.py --test --package
      - run: node collection/astrobox-imu-receiver/tools/test_roundtrip.cjs .cache/s5-transfer-research/receiver-target/debug/receiver_sim

  receiver-api4-runtime:
    runs-on: ubuntu-latest
    # These preserved standalone harnesses have the same executable name.
    # Give each variant its own runner/cache rather than reusing a prior binary.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: api4
            extra: --reproduce-api3
          - variant: api4-observation
            extra: ''
          - variant: api4-envelope-diagnostic
            extra: ''
          - variant: api4-envelope-adapter
            extra: ''
          - variant: api4-clean
            extra: ''
          - variant: api4-daily
            extra: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup default stable
      - run: rustup target add wasm32-wasip2
      - run: cargo fetch --locked --manifest-path collection/astrobox-imu-receiver/variants/${{ matrix.variant }}/Cargo.toml
      - run: cargo fetch --locked --manifest-path collection/astrobox-imu-receiver/variants/${{ matrix.variant }}/runtime-tests/Cargo.toml
      - run: python collection/astrobox-imu-receiver/variants/${{ matrix.variant }}/tools/build_local.py --test --package ${{ matrix.extra }}

  reference-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/reference_evaluation/requirements.txt
      - run: python -m unittest discover -s research/reference_evaluation -p 'test_*.py' -v
      - run: python research/reference_evaluation/demo.py --output /tmp/synthetic-reference-demo.json
