  <g id="text_19">
   <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'Microsoft YaHei', 'SimSun'; text-anchor: start" x="46.686614" y="17.858268" transform="rotate(-0 46.686614 17.858268)">先截断原始手机和手表数据，再恢复布局</text>
  </g>
  <g id="text_20">
   <text style="font-size: 7.5px; font-family: 'Arial', 'Microsoft YaHei', 'SimSun'; text-anchor: start; fill: #4e5d68" x="46.686614" y="37.502362" transform="rotate(-0 46.686614 37.502362)">同一批100间，模拟域手表规则；每个预算都先删除未来事件行和手机交付行。</text>
  </g>
  <g id="text_21">
   <text style="font-size: 7.2px; font-family: 'Arial', 'Microsoft YaHei', 'SimSun'; text-anchor: start" x="62.248819" y="292.875591" transform="rotate(-0 62.248819 292.875591)">75%预算：84/100，95%区间75.6–89.9%；中位时长59.1秒、中位覆盖19.9%。</text>
  </g>
  <g id="text_22">
   <text style="font-size: 7.2px; font-family: 'Arial', 'Microsoft YaHei', 'SimSun'; text-anchor: start" x="62.248819" y="314.305512" transform="rotate(-0 62.248819 314.305512)">这是本协议的首个80%实测格；中位数不能拼成“覆盖20%＋3类交互”的充分条件。</text>
  </g>
  <g id="text_23">
