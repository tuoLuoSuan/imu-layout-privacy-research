[package]
name = "imus5-receiver-api4"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
astrobox = ["dep:astrobox-ng-wit"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
astrobox-ng-wit = { version = "=0.4.0", optional = true }

[profile.release]
opt-level = "s"
lto = true
strip = true
