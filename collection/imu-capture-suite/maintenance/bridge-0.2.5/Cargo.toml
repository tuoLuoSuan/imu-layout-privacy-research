[package]
name = "imu-joint-bridge"
version = "0.2.5"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[features]
default = []
astrobox = ["dep:wit-bindgen"]
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
wit-bindgen = { version = "=0.57.1", optional = true, features = ["async", "async-spawn"] }
[profile.release]
opt-level = "s"
lto = true
strip = true
